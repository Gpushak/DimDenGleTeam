plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.warehouse'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.warehouse"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Адрес сервера можно переопределить без правки кода:
        //   ./gradlew assembleDebug -PapiHost=192.168.1.50 -PapiPort=8000
        def apiHost = (project.findProperty("apiHost") ?: System.getenv("API_HOST") ?: "10.0.2.2")
        def apiPort = (project.findProperty("apiPort") ?: System.getenv("API_PORT") ?: "8000")
        buildConfigField "String", "API_BASE_URL", "\"http://${apiHost}:${apiPort}/\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildToolsVersion '34.0.0'
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    // ActivityResultLauncher / registerForActivityResult (запуск QR-сканера)
    implementation libs.activity

    // Retrofit + Gson
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp.logging.interceptor

    // CameraX + ML Kit (сканирование QR-кодов)
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    implementation libs.mlkit.barcode.scanning

    // SwipeRefreshLayout
    implementation libs.swiperefreshlayout

    // Тесты: QrCodeTest разбирает QR-коды без сервера и без устройства.
    testImplementation libs.junit
}