# Единый docker-compose для проекта «АСУ складского учёта с весовым модулем и QR-идентификацией»
#
# Запуск:
#   docker compose up --build          # REST API (FastAPI + SQLite)
#   docker compose --profile scale up --build   # API + эмулятор весов
#   docker compose down                # остановить и удалить контейнеры (данные останутся в volume)
#
# Переменные окружения можно задать в файле .env рядом с этим compose-файлом
# (образец — .env.example).
#
# Десктопное приложение (desktop/) в Docker НЕ запускается: это GUI на
# tkinter, которому нужна графическая сессия хоста. Запускайте его нативно:
#   cd desktop && pip install -r requirements.txt && python main.py
# Подробнее — в desktop/README.md.

name: warehouse-asu

services:

  # ────────────────────────────────────────────────────────────────
  # REST API (FastAPI + SQLite) — сервер, десктоп и Android обращаются к нему
  # Swagger UI: http://localhost:${API_PORT:-8000}/docs
  # ────────────────────────────────────────────────────────────────
  api:
    build:
      # Контекст — корень репозитория, потому что образу нужен пакет
      # shared/ (единый протокол весов и QR), лежащий рядом с server/.
      # Поэтому в server/Dockerfile все COPY начинаются с server/.
      context: .
      dockerfile: server/Dockerfile
    image: warehouse-api:latest
    container_name: warehouse-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      WAREHOUSE_DB: /data/warehouse.db
    volumes:
      # Персистентное хранилище БД (не зависит от исходников репозитория)
      - warehouse-data:/data
      # Схема БД смонтирована из репозитория — позволяет менять схему без пересборки образа
      - ./server/db:/app/db:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ────────────────────────────────────────────────────────────────
  # Весовой модуль — эмулятор Serial/HX711, публикующий вес в POST /scale.
  # Работает в двух режимах:
  #   • без SERIAL_PORT (по умолчанию) — генерирует тестовые веса,
  #     позволяет проверить весовой контур без физического железа;
  #   • с SERIAL_PORT + SERIAL_DEVICE — читает реальный Arduino,
  #     порт пробрасывается из хоста (см. .env.example).
  # ────────────────────────────────────────────────────────────────
  scale-emulator:
    profiles: ["scale"]
    build:
      context: ./firmware
      dockerfile: weight_module/Dockerfile
    image: warehouse-scale-emulator:latest
    container_name: warehouse-scale-emulator
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      # Пусто → симуляция тестовых весов (см. firmware/weight_module/emulator.py)
      SERIAL_PORT: ${SERIAL_PORT:-}
      SERIAL_BAUD: ${SERIAL_BAUD:-9600}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-1.0}
      SIM_MIN_WEIGHT: ${SIM_MIN_WEIGHT:-0}
      SIM_MAX_WEIGHT: ${SIM_MAX_WEIGHT:-2500}
    # Проброс физического Serial-порта нужен ТОЛЬКО для реального Arduino.
    # Раскомментируйте обе строки и задайте SERIAL_DEVICE в .env:
    # devices:
    #   - ${SERIAL_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0

  # ────────────────────────────────────────────────────────────────
  # Мобильное приложение (Android) — НЕ контейнеризируется.
  # APK собирается отдельно (android/) и указывает на http://<IP-хоста>:${API_PORT:-8000}.
  # Для доступа с телефона или эмулятора используйте IP машины в LAN,
  # либо `host.docker.internal` при запуске приложения внутри Docker.
  # ────────────────────────────────────────────────────────────────

volumes:
  warehouse-data: